<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="chakraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0B1F5C" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Outer Wheel Rim -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="currentColor" stroke-width="4.5" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="currentColor" stroke-width="1.5" />
  
  <!-- Inner Wheel Hub -->
  <circle cx="100" cy="100" r="18" fill="none" stroke="currentColor" stroke-width="3" />
  <circle cx="100" cy="100" r="7" fill="currentColor" />

  <!-- 24 Spokes (15 degrees each) -->
  <g stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <!-- Spoke 1 to 24 -->
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(0 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(15 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(30 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(45 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(60 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(75 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(90 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(105 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(120 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(135 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(150 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(165 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(180 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(195 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(210 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(225 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(240 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(255 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(270 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(285 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(300 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(315 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(330 100 100)" />
    <line x1="100" y1="18" x2="100" y2="86" transform="rotate(345 100 100)" />
  </g>
</svg>
